name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nuropb-rmq
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync (dev tools for twine)
        run: uv sync --dev

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="${TAG#v}"
          PKG_VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$PKG_VERSION" != "$EXPECTED" ]; then
            echo "Tag $TAG does not match pyproject version $PKG_VERSION (expected $EXPECTED)"
            exit 1
          fi
          echo "Version OK: $PKG_VERSION"

      - name: Build sdist and wheel
        run: uv build

      - name: Twine check
        run: uvx twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
