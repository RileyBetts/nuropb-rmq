name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-specpp:
    name: Unit + SpeC++ + ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync (dev)
        run: uv sync --dev
      - name: Lock freeze check
        run: uv lock --check
      - name: Ruff
        run: uv run ruff check src tests
      - name: SpeC++ CheckSat
        run: uv run python specs/specpp/check_sat.py
      - name: Unit tests
        run: uv run pytest -q -m "not integration and not benchmark and not fuzz" --cov=nuropb_rmq --cov-report=term-missing --cov-fail-under=50
      - name: Frame decode fuzz
        env:
          HYPOTHESIS_PROFILE: ci
        run: uv run pytest -q -m fuzz
      - name: Build package
        run: uv build
      - name: Twine check
        run: uvx twine check dist/*

  claims:
    name: Claims unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync (dev + claims)
        run: uv sync --dev --extra claims
      - name: Claims pattern tests
        run: uv run pytest -q tests/patterns/test_context.py

  integration:
    name: Integration (RabbitMQ)
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync (dev + claims)
        run: uv sync --dev --extra claims
      - name: Integration tests
        env:
          NUROPB_RMQ_HOST: 127.0.0.1
          NUROPB_RMQ_PORT: "5672"
        run: uv run pytest -q -m integration

  lean:
    name: Lean Phase 1 / 1b / 2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: specs/lean
          build: true
          test: false
          lint: false
