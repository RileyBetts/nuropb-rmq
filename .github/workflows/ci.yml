name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-specpp:
    name: Unit + SpeC++ + ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync (dev)
        run: uv sync --dev
      - name: Lock freeze check
        run: uv lock --check
      - name: Ruff
        run: uv run ruff check src tests
      - name: SpeC++ CheckSat
        run: uv run python specs/specpp/check_sat.py
      - name: Unit tests
        run: uv run pytest -q -m "not integration and not benchmark and not fuzz" --cov=nuropb_rmq --cov-report=term-missing --cov-fail-under=50
      - name: Frame decode fuzz
        env:
          HYPOTHESIS_PROFILE: ci
        run: uv run pytest -q -m fuzz
      - name: Build package
        run: uv build
      - name: Twine check
        run: uvx twine check dist/*

  claims:
    name: Claims unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync (dev + claims)
        run: uv sync --dev --extra claims
      - name: Claims pattern tests
        run: uv run pytest -q tests/patterns/test_context.py tests/patterns/test_jwt_golden.py

  integration:
    name: Integration (RabbitMQ)
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3-management
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5672:5672
          - 15672:15672
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync (dev + claims)
        run: uv sync --dev --extra claims
      - name: Integration tests
        env:
          NUROPB_RMQ_HOST: 127.0.0.1
          NUROPB_RMQ_PORT: "5672"
          NUROPB_RMQ_MGMT_PORT: "15672"
        run: uv run pytest -q -m integration
      - name: Example smoke
        env:
          NUROPB_RMQ_HOST: 127.0.0.1
          NUROPB_RMQ_PORT: "5672"
        run: ./scripts/smoke_examples.sh

  amqps:
    name: AMQPS tls-verify-full
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync (dev)
        run: uv sync --dev
      - name: Generate AMQPS certs
        run: ./scripts/gen_amqps_certs.sh
      - name: Start RabbitMQ with TLS
        run: ./scripts/ci_start_amqps_broker.sh
      - name: AMQPS smoke
        env:
          NUROPB_RMQ_TLS: "1"
          NUROPB_RMQ_HOST: 127.0.0.1
          NUROPB_RMQ_PORT: "5671"
          NUROPB_RMQ_CA_FILE: ${{ github.workspace }}/dev/amqps/ca.pem
          NUROPB_RMQ_SERVER_HOSTNAME: localhost
        run: uv run pytest -q tests/integration/test_amqps_smoke.py

  lean:
    name: Lean NuropbRMQSpec + NuropbRMQ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: .
          build: false
          test: false
          lint: false
      - name: Proofs (no IO)
        run: lake build NuropbRMQSpec
      - name: Client (Std.Async)
        run: lake build NuropbRMQ
      - name: Golden oracle
        run: lake exe oracle .
      - name: Std.Async TCP smoke
        run: lake exe lean_async_tcp_smoke

  lean-amqps:
    name: Lean AMQPS tls-verify-full
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: .
          build: false
          test: false
          lint: false
      - name: Install OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Lean RS256/ES256 JWT verify
        run: ./scripts/smoke_lean_jwt_asymmetric.sh
      - name: Generate AMQPS certs
        run: ./scripts/gen_amqps_certs.sh
      - name: Start RabbitMQ with TLS
        run: ./scripts/ci_start_amqps_broker.sh
      - name: Lean AMQPS smoke
        env:
          NUROPB_RMQ_TLS: "1"
          NUROPB_RMQ_HOST: 127.0.0.1
          NUROPB_RMQ_PORT: "5671"
          NUROPB_RMQ_CA_FILE: ${{ github.workspace }}/dev/amqps/ca.pem
          NUROPB_RMQ_SERVER_HOSTNAME: localhost
        run: ./scripts/smoke_lean_amqps.sh

  lean-mtls:
    name: Lean AMQPS mTLS + SASL EXTERNAL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: .
          build: false
          test: false
          lint: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Sync (dev)
        run: uv sync --dev
      - name: Generate AMQPS certs
        run: ./scripts/gen_amqps_certs.sh
      - name: Start RabbitMQ with mTLS
        run: ./scripts/ci_start_amqps_mtls_broker.sh
      - name: Lean mTLS smoke
        env:
          NUROPB_RMQ_TLS: "1"
          NUROPB_RMQ_HOST: 127.0.0.1
          NUROPB_RMQ_PORT: "5671"
          NUROPB_RMQ_CA_FILE: ${{ github.workspace }}/dev/amqps/ca.pem
          NUROPB_RMQ_CERT_FILE: ${{ github.workspace }}/dev/amqps/client.pem
          NUROPB_RMQ_KEY_FILE: ${{ github.workspace }}/dev/amqps/client.key
          NUROPB_RMQ_SERVER_HOSTNAME: localhost
        run: ./scripts/smoke_lean_mtls.sh
      - name: Python mTLS smoke
        env:
          NUROPB_RMQ_MTLS: "1"
          NUROPB_RMQ_TLS: "1"
          NUROPB_RMQ_HOST: 127.0.0.1
          NUROPB_RMQ_PORT: "5671"
          NUROPB_RMQ_CA_FILE: ${{ github.workspace }}/dev/amqps/ca.pem
          NUROPB_RMQ_CERT_FILE: ${{ github.workspace }}/dev/amqps/client.pem
          NUROPB_RMQ_KEY_FILE: ${{ github.workspace }}/dev/amqps/client.key
          NUROPB_RMQ_SERVER_HOSTNAME: localhost
        run: uv run pytest -q tests/integration/test_amqps_mtls_smoke.py

  lean-interop:
    name: Lean↔Python interop examples
    runs-on: ubuntu-latest
    needs: [lean]
    services:
      rabbitmq:
        image: rabbitmq:3-management
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5672:5672
          - 15672:15672
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: .
          build: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: lake build
      - name: Interop smoke
        env:
          NUROPB_RMQ_HOST: 127.0.0.1
          NUROPB_RMQ_PORT: "5672"
        run: ./scripts/smoke_interop.sh
      - name: Lean IO coverage smoke
        env:
          NUROPB_RMQ_HOST: 127.0.0.1
          NUROPB_RMQ_PORT: "5672"
        run: ./scripts/smoke_lean_coverage.sh
      - name: Lean reply-forge 403
        env:
          NUROPB_RMQ_HOST: 127.0.0.1
          NUROPB_RMQ_PORT: "5672"
          NUROPB_RMQ_MGMT_PORT: "15672"
        run: ./scripts/smoke_lean_reply_acl.sh
      - name: Lean reply-forge 403 (regex narrower)
        env:
          NUROPB_RMQ_HOST: 127.0.0.1
          NUROPB_RMQ_PORT: "5672"
          NUROPB_RMQ_MGMT_PORT: "15672"
        run: ./scripts/smoke_lean_reply_acl_regex.sh
      - name: Lean RPC overlap
        env:
          NUROPB_RMQ_HOST: 127.0.0.1
          NUROPB_RMQ_PORT: "5672"
        run: ./scripts/smoke_lean_rpc_overlap.sh
