name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-specpp:
    name: Unit + SpeC++ + ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync (dev)
        run: uv sync --dev
      - name: Lock freeze check
        run: uv lock --check
      - name: Ruff
        run: uv run ruff check src tests
      - name: SpeC++ CheckSat
        run: uv run python specs/specpp/check_sat.py
      - name: Unit tests
        run: uv run pytest -q -m "not integration and not benchmark and not fuzz" --cov=nuropb_rmq --cov-report=term-missing --cov-fail-under=50
      - name: Frame decode fuzz
        env:
          HYPOTHESIS_PROFILE: ci
        run: uv run pytest -q -m fuzz
      - name: Build package
        run: uv build
      - name: Twine check
        run: uvx twine check dist/*

  claims:
    name: Claims unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync (dev + claims)
        run: uv sync --dev --extra claims
      - name: Claims pattern tests
        run: uv run pytest -q tests/patterns/test_context.py tests/patterns/test_jwt_golden.py

  integration:
    name: Integration (RabbitMQ)
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3-management
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5672:5672
          - 15672:15672
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync (dev + claims)
        run: uv sync --dev --extra claims
      - name: Integration tests
        env:
          NUROPB_RMQ_HOST: 127.0.0.1
          NUROPB_RMQ_PORT: "5672"
          NUROPB_RMQ_MGMT_PORT: "15672"
        run: uv run pytest -q -m integration
      - name: Example smoke
        env:
          NUROPB_RMQ_HOST: 127.0.0.1
          NUROPB_RMQ_PORT: "5672"
        run: ./scripts/smoke_examples.sh

  amqps:
    name: AMQPS tls-verify-full
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync (dev)
        run: uv sync --dev
      - name: Generate AMQPS certs
        run: ./scripts/gen_amqps_certs.sh
      - name: Start RabbitMQ with TLS
        run: |
          docker run -d --name rmq-amqps \
            -p 5671:5671 \
            -v "$PWD/dev/amqps:/certs:ro" \
            -v "$PWD/scripts/rabbitmq-amqps.ci.conf:/etc/rabbitmq/rabbitmq.conf:ro" \
            rabbitmq:3-management
          for i in $(seq 1 40); do
            if python3 -c "import socket; socket.create_connection(('127.0.0.1', 5671), 1).close()" 2>/dev/null; then
              echo "AMQPS listener ready"
              exit 0
            fi
            sleep 2
          done
          docker logs rmq-amqps || true
          exit 1
      - name: AMQPS smoke
        env:
          NUROPB_RMQ_TLS: "1"
          NUROPB_RMQ_HOST: 127.0.0.1
          NUROPB_RMQ_PORT: "5671"
          NUROPB_RMQ_CA_FILE: ${{ github.workspace }}/dev/amqps/ca.pem
          NUROPB_RMQ_SERVER_HOSTNAME: localhost
        run: uv run pytest -q tests/integration/test_amqps_smoke.py

  lean:
    name: Lean Phase 1 / 1b / 2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: specs/lean
          build: true
          test: false
          lint: false
