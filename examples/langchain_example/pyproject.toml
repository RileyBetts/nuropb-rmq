[project]
name = "nuropb-rmq-langchain-example"
version = "0.1.0"
description = "Self-standing LangChain agent calling a mesh service tool over nuropb-rmq"
requires-python = ">=3.11"
dependencies = [
  "langchain-core>=0.3",
  "langchain-openai>=0.2",
  "langchain-anthropic>=0.2",
  "nuropb-rmq",
]

[tool.uv]
package = false

[tool.uv.sources]
nuropb-rmq = { path = "../..", editable = true }
