[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nuropb-rmq"
version = "0.1.0"
description = "Native Python AMQP 0-9-1 client for RabbitMQ service mesh (RPC, events, mesh, reconnect)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "nuropb-rmq contributors" }]
dependencies = []
keywords = ["amqp", "rabbitmq", "rpc", "json-rpc", "service-mesh"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Distributed Computing",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/robertbetts/nuropb-rmq"
Changelog = "https://github.com/robertbetts/nuropb-rmq/blob/main/CHANGELOG.md"
Documentation = "https://github.com/robertbetts/nuropb-rmq#readme"
Repository = "https://github.com/robertbetts/nuropb-rmq"
Issues = "https://github.com/robertbetts/nuropb-rmq/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "z3-solver>=4.12",
  "hypothesis>=6.100",
  "ruff>=0.8",
]
bench = ["pika>=1.3", "pytest>=8", "pytest-asyncio>=0.24"]
claims = ["PyJWT>=2.8", "cryptography>=42"]

[project.scripts]
nuropb-rmq-bench = "bench.compare:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["nuropb_rmq*", "bench", "bench.*"]
exclude = ["tests*", "thinking*", "specs*", "bench.results*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not benchmark'"
markers = [
  "integration: requires a running RabbitMQ broker",
  "benchmark: throughput harness smoke (needs RabbitMQ + optional [bench] / pika)",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
