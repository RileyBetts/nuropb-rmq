[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nuropb-rmq"
version = "0.1.0"
description = "Native Python AMQP 0-9-1 client for a RabbitMQ service mesh (Transport/Protocol foundation)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "nuropb-rmq contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "z3-solver>=4.12", "hypothesis>=6.100"]
bench = ["pika>=1.3", "pytest>=8", "pytest-asyncio>=0.24"]
claims = ["PyJWT>=2.8", "cryptography>=42"]

[project.scripts]
nuropb-rmq-bench = "bench.compare:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["nuropb_rmq*", "bench", "bench.*"]
exclude = ["tests*", "thinking*", "specs*", "bench.results*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not benchmark'"
markers = [
  "integration: requires a running RabbitMQ broker",
  "benchmark: throughput harness smoke (needs RabbitMQ + optional [bench] / pika)",
]

[tool.ruff]
line-length = 100
