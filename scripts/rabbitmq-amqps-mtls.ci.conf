# CI AMQPS mTLS: verify_peer + SASL EXTERNAL. Paths are container-internal.
# Requires rabbitmq_auth_mechanism_ssl (see rabbitmq-amqps-mtls.enabled_plugins).
listeners.tcp.default = 5672
listeners.ssl.default = 5671

ssl_options.cacertfile = /certs/ca.pem
ssl_options.certfile   = /certs/server.pem
ssl_options.keyfile    = /certs/server.key
ssl_options.verify     = verify_peer
ssl_options.fail_if_no_peer_cert = true

ssl_cert_login_from = common_name

auth_mechanisms.1 = PLAIN
auth_mechanisms.2 = AMQPLAIN
auth_mechanisms.3 = EXTERNAL
